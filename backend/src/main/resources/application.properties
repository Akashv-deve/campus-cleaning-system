spring.application.name=demo

# Render assigns a random port at runtime via the PORT env var and only
# considers the service "live" once something is actually listening on
# that exact port.
server.port=${PORT:8080}

spring.data.mongodb.uri=${MONGODB_URI}

# Explicit, so the database name doesn't depend on Spring re-parsing it out
# of the URI's path segment.
spring.data.mongodb.database=campus_cleaning_db

# Known JDK/container bug: on some minimal container images, the JVM's
# cgroup-detection code (used by Micrometer's ProcessorMetrics, an Actuator
# CPU-usage metric) throws a NullPointerException at startup because the
# container doesn't expose cgroup controller info the way the JDK expects
# ("Cannot invoke CgroupInfo.getMountPoint() because anyController is
# null"). This has nothing to do with your app's logic or the Mongo
# connection — it's a metrics feature crashing and taking the whole app
# down with it. Excluding this one auto-configuration class skips just
# that CPU metric; every other Actuator/metrics feature keeps working.
spring.autoconfigure.exclude=org.springframework.boot.micrometer.metrics.autoconfigure.system.SystemMetricsAutoConfiguration