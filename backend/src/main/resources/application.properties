spring.application.name=demo

# Render assigns a random port at runtime via the PORT env var and only
# considers the service "live" once something is actually listening on
# that exact port. Without this, Spring Boot falls back to its default of
# 8080, which almost never matches what Render assigned — so Render's
# scanner waits, never finds an open port, and eventually gives up.
# The ${PORT:8080} syntax means: use the PORT env var if it's set (i.e. on
# Render), otherwise fall back to 8080 for local development.
server.port=${PORT:8080}

# NOTE: this was previously "spring.mongodb.uri" — that key isn't a real
# Spring Boot property, so it was being silently ignored. The correct
# property is "spring.data.mongodb.uri". With the wrong key, Spring Boot's
# Mongo auto-configuration falls back to its default of
# mongodb://localhost/test — meaning your Atlas connection string above
# was never actually being used in production, and the app would try to
# reach a local Mongo instance that doesn't exist on Render's servers.
